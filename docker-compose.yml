name: backflip

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-backflip}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-backflip_local_dev}
      POSTGRES_DB: ${POSTGRES_DB:-backflip}
    ports:
      # Host port off the default 5432 to avoid clashing with other local pg.
      - "${POSTGRES_PORT:-5544}:5432"
    volumes:
      - backflip_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-backflip}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    environment:
      # Inside the compose network the db is reachable at host `db`, port 5432.
      DATABASE_URL: postgres://${POSTGRES_USER:-backflip}:${POSTGRES_PASSWORD:-backflip_local_dev}@db:5432/${POSTGRES_DB:-backflip}
    ports:
      # Host 3071 → container 3070 (same internal port as local dev).
      - "3071:3070"
    depends_on:
      db:
        condition: service_healthy

volumes:
  backflip_pgdata:
