# Release automation (@spec L2-DEVOPS-29).
#
# Every push to master, semantic-release reads the conventional commits since
# the last tag, decides the next version, and in ONE run: bumps the root
# package.json (which is what the app displays, L2-UI-19), writes the
# changelog, commits both, tags, and publishes the GitHub release. Bump and
# tag can no longer disagree — the failure that left v1.2.0 announcing v1.1.0.
#
# The release commit is pushed over SSH with a write-enabled deploy key
# (secret RELEASE_SSH_KEY), not with GITHUB_TOKEN. Master's ruleset requires
# signed commits and the runner has no signing key, so the push needs a bypass
# actor — and on a user-owned repo the bypass list offers no GitHub Actions
# entry, only roles and "Deploy keys". The key is therefore the actor: scoped
# to this repo, revocable, impersonating no account. GITHUB_TOKEN still
# authenticates the GitHub Release itself.
#
# Setup (once): ssh-keygen -t ed25519 -f backflip_release -N ""
#   - public half  -> Settings > Deploy keys, "Allow write access" ticked
#   - private half -> secret RELEASE_SSH_KEY
#   - ruleset "Protect master branch" > Bypass list > Deploy keys
name: release

on:
  push:
    branches: [master]

# Never two releases at once: both would compute the same next version.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history + tags: the next version is derived from the commits
          # since the last tag, and a shallow clone has neither.
          fetch-depth: 0
          # The release push authenticates with the deploy key below; leaving
          # the checkout credentials in place makes it ambiguous which of the
          # two git would use.
          persist-credentials: false

      # semantic-release keeps the URL it finds on `origin` when that URL
      # already authenticates (it probes with a dry-run push first), and falls
      # back to a token-bearing https URL otherwise. Handing it an SSH origin
      # plus a loaded key is what keeps the push on the deploy key.
      - name: Authorize the release push with the deploy key
        env:
          RELEASE_SSH_KEY: ${{ secrets.RELEASE_SSH_KEY }}
        run: |
          if [ -z "$RELEASE_SSH_KEY" ]; then
            echo "::error::RELEASE_SSH_KEY is not set — see the header of this workflow."
            exit 1
          fi
          mkdir -p ~/.ssh
          umask 077
          printf '%s\n' "$RELEASE_SSH_KEY" > ~/.ssh/release_key
          ssh-keyscan -t rsa,ecdsa,ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          echo "GIT_SSH_COMMAND=ssh -i ~/.ssh/release_key -o IdentitiesOnly=yes" >> "$GITHUB_ENV"
          git remote set-url origin git@github.com:${{ github.repository }}.git

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: corepack enable
      - run: corepack yarn install --immutable

      - run: corepack yarn semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
