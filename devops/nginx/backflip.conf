# @spec L2-DEVOPS-05
# nginx site template for the pm2 droplet flavor. setup-droplet-for-pm2.sh
# renders __DOMAIN__/__PORT__ and installs it as
# /etc/nginx/sites-available/<app-name>.conf — one site per instance.
# certbot --nginx later injects the TLS listener + http->https redirect.
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    location / {
        proxy_pass http://127.0.0.1:__PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }
}
