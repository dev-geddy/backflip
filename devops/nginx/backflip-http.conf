# @spec L2-DEVOPS-22, L2-DEVOPS-23
# http-context nginx snippet, installed to /etc/nginx/conf.d/ (included in the
# http block). Shared by every backflip instance on the host — not per-site.
# setup-droplet-for-pm2.sh pushes this verbatim (no templating).

# Edge rate limit for the credentials login endpoint: 10 requests/min per client
# IP, small burst. Throttles credential-stuffing at the proxy, on top of the
# app-level per-IP+email login throttle (L2-AUTH-40). Deliberately scoped to the
# login callback only — NOT all of /api/auth/* (that includes /session, which
# the client polls). Keyed on $binary_remote_addr; 10m holds ~160k IPs.
limit_req_zone $binary_remote_addr zone=backflip_auth:10m rate=10r/m;

# Scrub single-use tokens out of access logs: any request URI carrying a
# `token=` query param is logged with its query string redacted, so reset /
# email-verify links don't sit in plaintext in access.log or a log shipper.
map $request_uri $backflip_loggable_uri {
    default                 $request_uri;
    "~*^(?<path>[^?]*)\?.*token="  "${path}?[redacted]";
}

log_format backflip_scrubbed
    '$remote_addr - $remote_user [$time_local] '
    '"$request_method $backflip_loggable_uri $server_protocol" '
    '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
